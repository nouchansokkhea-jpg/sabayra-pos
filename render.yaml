databases:
  - name: sabayra-db
    databaseName: menuhub_db
    user: sabayra_user
    plan: free
    region: singapore

services:
  - type: web
    name: sabayra-pos
    runtime: docker
    region: singapore
    plan: free
    branch: main
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: "SABAYRA"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: RUN_MIGRATIONS
        value: "true"
      - key: SESSION_DRIVER
        value: "database"
      - key: CACHE_STORE
        value: "database"
      - key: QUEUE_CONNECTION
        value: "database"
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: sabayra-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: sabayra-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: sabayra-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: sabayra-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: sabayra-db
          property: password
      - key: DEFAULT_CURRENCY
        value: "USD"
      - key: DEFAULT_EXCHANGE_RATE_KHR
        value: "4100"
      - key: SUPABASE_URL
        value: "https://zdqqrqtujqwvlmbasuqo.supabase.co"
      - key: SUPABASE_STORAGE_BUCKET
        value: "menuhub-assets"
