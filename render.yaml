databases:
  - name: sabayra-db
    databaseName: menuhub_db
    user: sabayra_user
    plan: free
    region: singapore

services:
  - type: web
    name: sabayra-pos
    runtime: docker
    region: singapore
    plan: free
    branch: main
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: "SABAYRA"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: RUN_MIGRATIONS
        value: "true"
      - key: MAIL_MAILER
        value: "log"
      - key: MAIL_HOST
        value: "127.0.0.1"
      - key: SESSION_DRIVER
        value: "database"
      - key: CACHE_STORE
        value: "database"
      - key: QUEUE_CONNECTION
        value: "database"
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: sabayra-db
          property: connectionString
      - key: DB_HOST
        fromDatabase:
          name: sabayra-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: sabayra-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: sabayra-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: sabayra-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: sabayra-db
          property: password
      - key: DB_SSLMODE
        value: "prefer"
      - key: DEFAULT_CURRENCY
        value: "USD"
      - key: DEFAULT_EXCHANGE_RATE_KHR
        value: "4100"
      - key: SUPABASE_URL
        value: "https://zdqqrqtujqwvlmbasuqo.supabase.co"
      - key: SUPABASE_STORAGE_BUCKET
        value: "menuhub-assets"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        value: "Sabayrabot"
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      - key: TELEGRAM_VERIFICATION_TTL_MINUTES
        value: "15"
      - key: TELEGRAM_VERIFY_SSL
        value: "true"
      - key: TELEGRAM_POLLING_FALLBACK
        value: "false"
